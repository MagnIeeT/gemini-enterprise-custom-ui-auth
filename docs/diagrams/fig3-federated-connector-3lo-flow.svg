<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Google Sans', 'Roboto', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#202124" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e8e3e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e37400"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9334e6"/>
    </marker>
  </defs>

  <!-- Title & Legend Header -->
  <g id="header">
    <text x="28" y="36" font-size="19" font-weight="700" fill="#202124">Part 2: Federated Connector 3LO Authentication Flow</text>
    <text x="28" y="56" font-size="12" fill="#5f6368">Component architecture &amp; 11-step OAuth handshake across Custom UI, Backend, GE Server, and Keystore</text>

    <!-- Compact Phase Legend Top-Right -->
    <g transform="translate(628, 16)">
      <rect width="468" height="44" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
      <rect x="12" y="12" width="32" height="20" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
      <text x="28" y="25.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#174ea6">1–4</text>
      <text x="50" y="26" font-size="10.5" font-weight="500" fill="#3c4043">Check Keystore</text>

      <rect x="148" y="12" width="32" height="20" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.4"/>
      <text x="164" y="25.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9334e6">5–7</text>
      <text x="186" y="26" font-size="10.5" font-weight="500" fill="#3c4043">3LO Popup &amp; Redirect</text>

      <rect x="314" y="12" width="36" height="20" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.4"/>
      <text x="332" y="25.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#137333">8–11</text>
      <text x="356" y="26" font-size="10.5" font-weight="500" fill="#3c4043">Save Token &amp; Confirm</text>
    </g>
  </g>

  <!-- Main Canvas Background -->
  <rect x="24" y="76" width="1072" height="540" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>

  <!-- Domain Zone Headers -->
  <rect x="44" y="94" width="548" height="30" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1"/>
  <text x="318" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#174ea6">Customer Domain (www.cust.com) &amp; Third-Party IdP</text>

  <rect x="616" y="94" width="460" height="30" rx="6" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1"/>
  <text x="846" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#137333">Google Cloud — Gemini Enterprise Managed Services</text>

  <!-- ==================== NODES ==================== -->

  <!-- Users Icon -->
  <g id="node-user" transform="translate(46, 360)">
    <circle cx="34" cy="24" r="19" fill="#4285f4"/>
    <path d="M8,70 C8,46 60,46 60,70 Z" fill="#4285f4"/>
    <text x="34" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Users</text>
  </g>

  <!-- Customer UI (www.cust.com) -->
  <g id="node-cust-ui" transform="translate(132, 326)" filter="url(#card-shadow)">
    <rect width="168" height="140" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.8"/>
    <text x="84" y="48" text-anchor="middle" font-size="14.5" font-weight="700" fill="#202124">Customer UI</text>
    <text x="84" y="70" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" fill="#5f6368">(www.cust.com)</text>
    <rect x="22" y="90" width="124" height="28" rx="6" fill="#f1f3f4" stroke="#dadce0" stroke-width="1"/>
    <text x="84" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#3c4043">Authorize Button</text>
  </g>

  <!-- Customer BE (www.cust.com) -->
  <g id="node-cust-be" transform="translate(412, 326)" filter="url(#card-shadow)">
    <rect width="176" height="140" rx="10" fill="#d2e3fc" stroke="#174ea6" stroke-width="1.8"/>
    <text x="88" y="48" text-anchor="middle" font-size="14.5" font-weight="700" fill="#174ea6">Customer BE</text>
    <text x="88" y="70" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" fill="#174ea6">(www.cust.com)</text>
    <text x="88" y="98" text-anchor="middle" font-size="11" fill="#3c4043">Mediates GE API calls</text>
    <text x="88" y="114" text-anchor="middle" font-size="11" fill="#3c4043">with Part 1 User Token</text>
  </g>

  <!-- Cylinder: <user, goog_oauth_token> below Customer BE -->
  <g id="node-user-token-db" transform="translate(432, 512)" filter="url(#card-shadow)">
    <path d="M 0,14 L 0,74 A 68,12 0 0,0 136,74 L 136,14 Z" fill="#d2e3fc" stroke="#174ea6" stroke-width="1.6"/>
    <ellipse cx="68" cy="14" rx="68" ry="12" fill="#e8f0fe" stroke="#174ea6" stroke-width="1.6"/>
    <text x="68" y="42" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" font-weight="600" fill="#174ea6">&lt;user,</text>
    <text x="68" y="57" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" font-weight="600" fill="#174ea6">goog_oauth</text>
    <text x="68" y="72" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" font-weight="600" fill="#174ea6">_token&gt;</text>
  </g>

  <!-- 3P Auth Server (Top Middle — raised slightly for clean clearance above arrows 6 & 7) -->
  <g id="node-3p-auth" transform="translate(384, 134)" filter="url(#card-shadow)">
    <rect width="192" height="106" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="1.8"/>
    <text x="96" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#b06000">3P Auth Server</text>
    <text x="96" y="55" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" fill="#3c4043">(Entra ID / Google /</text>
    <text x="96" y="71" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" fill="#3c4043">Jira / Box / ServiceNow)</text>
    <text x="96" y="92" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b06000">3LO Consent Endpoint</text>
  </g>

  <!-- GE FE Server (vertexaisearch.cloud.google.com/oauth-redirect) -->
  <g id="node-ge-fe" transform="translate(692, 168)" filter="url(#card-shadow)">
    <rect width="204" height="118" rx="10" fill="#ceead6" stroke="#137333" stroke-width="1.8"/>
    <text x="102" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d652d">GE FE Server</text>
    <text x="102" y="54" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" fill="#0d652d">(vertexaisearch.</text>
    <text x="102" y="70" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" fill="#0d652d">cloud.google.com</text>
    <text x="102" y="86" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" font-weight="600" fill="#0d652d">/oauth-redirect)</text>
    <text x="102" y="106" text-anchor="middle" font-size="10.5" fill="#3c4043">OAuth Redirect Handler</text>
  </g>

  <!-- GE Server (discoveryengine.googleapis.com) -->
  <g id="node-ge-server" transform="translate(692, 326)" filter="url(#card-shadow)">
    <rect width="204" height="140" rx="10" fill="#ceead6" stroke="#137333" stroke-width="1.8"/>
    <text x="102" y="36" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d652d">GE Server</text>
    <text x="102" y="56" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" fill="#0d652d">(discoveryengine.</text>
    <text x="102" y="72" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10.5" fill="#0d652d">googleapis.com)</text>
    <text x="102" y="96" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="9.5" fill="#3c4043">• widgetConfigs</text>
    <text x="102" y="111" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="9.5" fill="#3c4043">• acquireAccessToken</text>
    <text x="102" y="126" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="9.5" fill="#3c4043">• acquireAndStoreRefresh</text>
  </g>

  <!-- Cylinder: Keystore (connected ONLY to GE Server) -->
  <g id="node-keystore" transform="translate(952, 286)" filter="url(#card-shadow)">
    <path d="M 0,14 L 0,80 A 60,12 0 0,0 120,80 L 120,14 Z" fill="#ceead6" stroke="#137333" stroke-width="1.6"/>
    <ellipse cx="60" cy="14" rx="60" ry="12" fill="#e6f4ea" stroke="#137333" stroke-width="1.6"/>
    <text x="60" y="50" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d652d">Keystore</text>
    <text x="60" y="68" text-anchor="middle" font-size="10" fill="#3c4043">3LO Refresh Tokens</text>
  </g>

  <!-- Cylinder: User Table (connected ONLY to GE Server) -->
  <g id="node-user-table" transform="translate(952, 412)" filter="url(#card-shadow)">
    <path d="M 0,14 L 0,80 A 60,12 0 0,0 120,80 L 120,14 Z" fill="#ceead6" stroke="#137333" stroke-width="1.6"/>
    <ellipse cx="60" cy="14" rx="60" ry="12" fill="#e6f4ea" stroke="#137333" stroke-width="1.6"/>
    <text x="60" y="50" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d652d">User Table</text>
    <text x="60" y="68" text-anchor="middle" font-size="10" fill="#3c4043">Per-User Mapping</text>
  </g>

  <!-- ==================== ARROWS & NUMBERED STEPS 1–11 ==================== -->

  <!-- Customer BE -> <user, goog_oauth_token> -->
  <line x1="500" y1="466" x2="500" y2="504" stroke="#174ea6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- GE Server -> Keystore & User Table (NO arrow from GE FE Server to Keystore!) -->
  <path d="M 896 368 C 924 368, 924 334, 944 334" fill="none" stroke="#137333" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 896 424 C 924 424, 924 456, 944 456" fill="none" stroke="#137333" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Customer UI -> 3P Auth Server -->
  <line x1="212" y1="326" x2="376" y2="196" stroke="#e37400" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="292" cy="262" r="12" fill="#fef7e0" stroke="#e37400" stroke-width="1.6"/>
  <text x="292" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">5</text>

  <!-- Step 6: Customer UI (Popup) -> GE FE Server (/oauth-redirect) -->
  <line x1="300" y1="342" x2="684" y2="232" stroke="#9334e6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <circle cx="468" cy="294" r="12" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.6"/>
  <text x="468" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#9334e6">6</text>

  <!-- Step 7: GE FE Server (/oauth-redirect) -> Customer UI (postMessage) -->
  <line x1="692" y1="252" x2="308" y2="362" stroke="#9334e6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
  <circle cx="508" cy="305" r="12" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.6"/>
  <text x="508" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#9334e6">7</text>

  <!-- Step 1: Customer UI -> Customer BE -->
  <line x1="300" y1="368" x2="404" y2="368" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="354" cy="368" r="11" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="354" y="372" text-anchor="middle" font-size="10.5" font-weight="700" fill="#174ea6">1</text>

  <!-- Step 4: Customer BE -> Customer UI -->
  <line x1="412" y1="394" x2="308" y2="394" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="354" cy="394" r="11" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="354" y="398" text-anchor="middle" font-size="10.5" font-weight="700" fill="#174ea6">4</text>

  <!-- Step 8: Customer UI -> Customer BE -->
  <line x1="300" y1="422" x2="404" y2="422" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="354" cy="422" r="11" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="354" y="426" text-anchor="middle" font-size="10.5" font-weight="700" fill="#137333">8</text>

  <!-- Step 11: Customer BE -> Customer UI -->
  <line x1="412" y1="448" x2="308" y2="448" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="354" cy="448" r="11" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="354" y="452" text-anchor="middle" font-size="10.5" font-weight="700" fill="#137333">11</text>

  <!-- Step 2: Customer BE -> GE Server -->
  <line x1="588" y1="368" x2="684" y2="368" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="638" cy="368" r="11" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="638" y="372" text-anchor="middle" font-size="10.5" font-weight="700" fill="#174ea6">2</text>

  <!-- Step 3: GE Server -> Customer BE -->
  <line x1="692" y1="394" x2="596" y2="394" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="638" cy="394" r="11" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="638" y="398" text-anchor="middle" font-size="10.5" font-weight="700" fill="#174ea6">3</text>

  <!-- Step 9: Customer BE -> GE Server -->
  <line x1="588" y1="422" x2="684" y2="422" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="638" cy="422" r="11" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="638" y="426" text-anchor="middle" font-size="10.5" font-weight="700" fill="#137333">9</text>

  <!-- Step 10: GE Server -> Customer BE -->
  <line x1="692" y1="448" x2="596" y2="448" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="638" cy="448" r="11" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="638" y="452" text-anchor="middle" font-size="10.5" font-weight="700" fill="#137333">10</text>

</svg>