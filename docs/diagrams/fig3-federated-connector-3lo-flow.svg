<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1023" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "Google Sans", "Roboto", sans-serif; font-size: 20px; font-weight: 700; fill: #202124; }
      .subtitle { font-family: "Google Sans", "Roboto", sans-serif; font-size: 13px; font-weight: 400; fill: #5F6368; }
      .actor-title { font-family: "Google Sans", "Roboto", sans-serif; font-size: 12.5px; font-weight: 700; fill: #202124; text-anchor: middle; }
      .actor-sub { font-family: "Roboto Mono", monospace; font-size: 10px; font-weight: 500; fill: #1A73E8; text-anchor: middle; }
      .step-label { font-family: "Google Sans", "Roboto", sans-serif; font-size: 12px; font-weight: 600; fill: #202124; text-anchor: middle; }
      .step-sub { font-family: "Roboto Mono", monospace; font-size: 10.5px; font-weight: 500; fill: #5F6368; text-anchor: middle; }
      .phase-text { font-family: "Google Sans", "Roboto", sans-serif; font-size: 12px; font-weight: 700; fill: #174EA6; text-anchor: middle; }
    </style>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#202124"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9334E6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1E8E3E"/>
    </marker>
  </defs>
  <rect width="1320" height="1023" fill="#FFFFFF"/>
  <text x="32" y="42" class="title">Part 2 Sequence: Authenticating a Federated Connector from a Custom UI</text>
  <text x="32" y="64" class="subtitle">Step-by-step request flow across Custom UI, Discovery Engine (dataConnector &amp; Keystore), OAuth Redirect Relay, and 3P SaaS</text>
  <line x1="105" y1="159" x2="105" y2="951" stroke="#BDC1C6" stroke-width="1.75"/>
  <line x1="300" y1="159" x2="300" y2="951" stroke="#BDC1C6" stroke-width="1.75"/>
  <line x1="505" y1="159" x2="505" y2="951" stroke="#BDC1C6" stroke-width="1.75"/>
  <line x1="745" y1="159" x2="745" y2="951" stroke="#BDC1C6" stroke-width="1.75"/>
  <line x1="995" y1="159" x2="995" y2="951" stroke="#BDC1C6" stroke-width="1.75"/>
  <line x1="1215" y1="159" x2="1215" y2="951" stroke="#BDC1C6" stroke-width="1.75"/>
  <rect x="35.0" y="115" width="140" height="44" rx="6" fill="#F8FAFC" stroke="#202124" stroke-width="1.75"/>
  <text x="105" y="134" class="actor-title">Employee</text>
  <text x="105" y="149" class="actor-sub">Browser User</text>
  <rect x="222.5" y="115" width="155" height="44" rx="6" fill="#F8FAFC" stroke="#202124" stroke-width="1.75"/>
  <text x="300" y="134" class="actor-title">Custom UI</text>
  <text x="300" y="149" class="actor-sub">Web Frontend</text>
  <rect x="425.0" y="115" width="160" height="44" rx="6" fill="#F8FAFC" stroke="#202124" stroke-width="1.75"/>
  <text x="505" y="134" class="actor-title">App Backend</text>
  <text x="505" y="149" class="actor-sub">FastAPI Server</text>
  <rect x="642.5" y="115" width="205" height="44" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.75"/>
  <text x="745" y="134" class="actor-title">Discovery Engine</text>
  <text x="745" y="149" class="actor-sub">dataConnector &amp; Keystore</text>
  <rect x="890.0" y="115" width="210" height="44" rx="6" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.75"/>
  <text x="995" y="134" class="actor-title">GE OAuth Relay</text>
  <text x="995" y="149" class="actor-sub">vertexaisearch.../oauth-redirect</text>
  <rect x="1137.5" y="115" width="155" height="44" rx="6" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.75"/>
  <text x="1215" y="134" class="actor-title">3P SaaS API</text>
  <text x="1215" y="149" class="actor-sub">Jira / ServiceNow</text>
  <rect x="35.0" y="951" width="140" height="44" rx="6" fill="#F8FAFC" stroke="#202124" stroke-width="1.75"/>
  <text x="105" y="970" class="actor-title">Employee</text>
  <text x="105" y="985" class="actor-sub">Browser User</text>
  <rect x="222.5" y="951" width="155" height="44" rx="6" fill="#F8FAFC" stroke="#202124" stroke-width="1.75"/>
  <text x="300" y="970" class="actor-title">Custom UI</text>
  <text x="300" y="985" class="actor-sub">Web Frontend</text>
  <rect x="425.0" y="951" width="160" height="44" rx="6" fill="#F8FAFC" stroke="#202124" stroke-width="1.75"/>
  <text x="505" y="970" class="actor-title">App Backend</text>
  <text x="505" y="985" class="actor-sub">FastAPI Server</text>
  <rect x="642.5" y="951" width="205" height="44" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.75"/>
  <text x="745" y="970" class="actor-title">Discovery Engine</text>
  <text x="745" y="985" class="actor-sub">dataConnector &amp; Keystore</text>
  <rect x="890.0" y="951" width="210" height="44" rx="6" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.75"/>
  <text x="995" y="970" class="actor-title">GE OAuth Relay</text>
  <text x="995" y="985" class="actor-sub">vertexaisearch.../oauth-redirect</text>
  <rect x="1137.5" y="951" width="155" height="44" rx="6" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.75"/>
  <text x="1215" y="970" class="actor-title">3P SaaS API</text>
  <text x="1215" y="985" class="actor-sub">Jira / ServiceNow</text>
  <rect x="61" y="181" width="728" height="30" rx="4" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="425.0" y="201" class="phase-text" style="fill:#174EA6">Phase 1: Silent Token Pre-Check in Gemini Enterprise Keystore</text>
  <rect x="15.700000000000017" y="220" width="373.59999999999997" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="202.5" y="233" class="step-label" style="fill:#202124">1. Sends query requiring Jira / ServiceNow connector</text>
  <line x1="105" y1="241" x2="297" y2="241" stroke="#202124" stroke-width="1.75" marker-end="url(#arrow-solid)"/>
  <rect x="239.5" y="266" width="326.0" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="402.5" y="279" class="step-label" style="fill:#202124">2. Forwards query + Layer 1 User Bearer token</text>
  <line x1="300" y1="287" x2="502" y2="287" stroke="#202124" stroke-width="1.75" marker-end="url(#arrow-solid)"/>
  <rect x="482.4" y="312" width="285.2" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="625.0" y="325" class="step-label" style="fill:#1A73E8">3. GET dataConnector:acquireAccessToken</text>
  <line x1="505" y1="333" x2="742" y2="333" stroke="#1A73E8" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <rect x="424.6" y="358" width="400.8" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="625.0" y="371" class="step-label" style="fill:#1A73E8">4. No token in Keystore -&gt; returns 3P authUri &amp; clientId</text>
  <line x1="745" y1="379" x2="508" y2="379" stroke="#1A73E8" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <rect x="239.5" y="404" width="326.0" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="402.5" y="417" class="step-label" style="fill:#202124">5. Returns needs_oauth + authUri to Custom UI</text>
  <line x1="505" y1="425" x2="303" y2="425" stroke="#202124" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-solid)"/>
  <rect x="256" y="457" width="1003" height="30" rx="4" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.5"/>
  <text x="757.5" y="477" class="phase-text" style="fill:#681DA8">Phase 2: First-Time Browser OAuth Consent &amp; postMessage Relay</text>
  <rect x="553.7" y="496" width="407.59999999999997" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="757.5" y="509" class="step-label" style="fill:#9334E6">6. Opens 3P OAuth Consent Popup (redirect_uri = GE Relay)</text>
  <line x1="300" y1="517" x2="1212" y2="517" stroke="#9334E6" stroke-width="1.75" marker-end="url(#arrow-purple)"/>
  <rect x="901.2" y="542" width="407.59999999999997" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="1105.0" y="555" class="step-label" style="fill:#9334E6">7. User approves -&gt; 302 Redirect with ?code=...&amp;state=...</text>
  <line x1="1215" y1="563" x2="998" y2="563" stroke="#9334E6" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <rect x="450.5" y="588" width="394.0" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="647.5" y="601" class="step-label" style="fill:#9334E6">8. Relays fullRedirectUri via window.opener.postMessage</text>
  <line x1="995" y1="609" x2="303" y2="609" stroke="#9334E6" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <rect x="256" y="641" width="1003" height="30" rx="4" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="757.5" y="661" class="phase-text" style="fill:#137333">Phase 3: Store Refresh Token in Keystore &amp; Execute Grounded Query</text>
  <rect x="219.1" y="680" width="366.8" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="402.5" y="693" class="step-label" style="fill:#202124">9. Sends captured fullRedirectUri (with OAuth code)</text>
  <line x1="300" y1="701" x2="502" y2="701" stroke="#202124" stroke-width="1.75" marker-end="url(#arrow-solid)"/>
  <rect x="445.0" y="726" width="360.0" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="625.0" y="739" class="step-label" style="fill:#1E8E3E">10. POST dataConnector:acquireAndStoreRefreshToken</text>
  <line x1="505" y1="747" x2="742" y2="747" stroke="#1E8E3E" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <rect x="755.8" y="772" width="448.4" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="980.0" y="785" class="step-label" style="fill:#1E8E3E">11. Exchanges code &amp; stores encrypted refresh token in Keystore</text>
  <line x1="745" y1="793" x2="1212" y2="793" stroke="#1E8E3E" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <rect x="400.8" y="818" width="448.4" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="625.0" y="831" class="step-label" style="fill:#1E8E3E">12. POST :streamAssist (auto-uses Keystore token for 3P search)</text>
  <line x1="505" y1="839" x2="742" y2="839" stroke="#1E8E3E" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <rect x="305.1" y="864" width="434.8" height="18" rx="4" fill="#FFFFFF" opacity="0.94"/>
  <text x="522.5" y="877" class="step-label" style="fill:#1E8E3E">13. Streams grounded, ACL-filtered response back to Custom UI</text>
  <line x1="745" y1="885" x2="303" y2="885" stroke="#1E8E3E" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
</svg>